<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="title desc">
  <title id="title">RouteLedger</title>
  <desc id="desc">RouteLedger HOS trip planning and ELD logo</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d8f"/>
      <stop offset="0.62" stop-color="#0b4fb3"/>
      <stop offset="1" stop-color="#082c68"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2e67"/>
      <stop offset="0.58" stop-color="#0b4aa3"/>
      <stop offset="1" stop-color="#0a63df"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33b8ff"/>
      <stop offset="1" stop-color="#0b63f6"/>
    </linearGradient>
  </defs>

  <g transform="translate(10 10)">
    <!-- Bold R top/bowl -->
    <path
      d="M10 10h86c31 0 54 8 69 24 12 13 18 29 18 49 0 21-6 38-19 51-11 10-25 17-43 20l34 44h-43l-38-51h21c18 0 32-4 40-12 8-7 12-17 12-31 0-14-4-24-12-31-9-7-22-10-40-10H34z"
      fill="url(#navy)"
    />

    <!-- Road body: solid and clearly visible on white -->
    <path
      d="M15 150c18-36 37-65 57-87 22-24 48-42 78-54-22 18-42 40-58 65-17 26-30 51-39 76z"
      fill="url(#road)"
    />

    <!-- Separate bright leg of the R -->
    <path
      d="M83 150c8-28 20-52 36-73 15-20 34-36 56-49-13 17-23 35-30 54l48 68h-44l-28-40c-5 12-9 25-12 40z"
      fill="url(#cyan)"
    />

    <!-- Lane markings only; no white cut-through path -->
    <path d="M42 127l16-3-7 18-17 3z" fill="#ffffff"/>
    <path d="M57 99l15-3-7 17-16 3z" fill="#ffffff"/>
    <path d="M74 75l13-3-6 14-14 3z" fill="#ffffff"/>
  </g>

  <g transform="translate(220 39)">
    <text x="0" y="57" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
      <tspan fill="#0f172a">Route</tspan><tspan fill="#0b63f6">Ledger</tspan>
    </text>
    <text x="2" y="101" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="5" fill="#64748b">
      HOS TRIP PLANNING &amp; ELD
    </text>
  </g>
</svg>
